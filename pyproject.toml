[project]
name = "robot-agent"
version = "0.1.0"
description = "A simple agent framework built on pydantic-ai, with text and image input support."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=5.1.0.95",
    "pydantic-ai-slim[openai]>=1.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["robot_agent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# The example CLI must survive any API/runtime error and keep the chat session alive.
"examples/cli.py" = ["BLE001"]
